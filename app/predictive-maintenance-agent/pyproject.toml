[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maintenance-agent"
version = "1.0.0"
description = "Local Manufacturing Predictive Maintenance Analysis Agent"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Claude AI", email = "noreply@anthropic.com"}
]
license = {text = "MIT"}

dependencies = [
    "langgraph>=0.1.0",
    "pandas>=2.0",
    "pydantic>=2.0",
    "pydantic-core>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "black>=23.0",
    "ruff>=0.1",
]

[project.scripts]
maintenance-agent = "maintenance_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short --cov=src/maintenance_agent --cov-report=term-missing"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
